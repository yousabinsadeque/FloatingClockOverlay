name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "FloatingClockOverlay-Windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained win-x64 build
        run: >
          dotnet publish FloatingClockOverlay-Windows/FloatingClockOverlay/FloatingClockOverlay.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingClockOverlay-Windows
          path: publish/FloatingClockOverlay.exe
